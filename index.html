<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enotessa — мобильные приложения и игры</title>
  <meta name="description" content="Официальный сайт разработчика мобильных приложений и игр Enotessa.">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #403833;
      background: #eef8f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 193, 170, .55), transparent 32%),
        radial-gradient(circle at 85% 82%, rgba(124, 206, 187, .45), transparent 34%),
        #eef8f4;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(107, 139, 126, .22);
      border-radius: 32px;
      background: rgba(255, 253, 247, .94);
      box-shadow: 0 24px 70px rgba(63, 92, 80, .16);
      text-align: center;
    }
    .mark {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, #ffb69f, #f28779);
      box-shadow: 0 12px 25px rgba(219, 111, 92, .24);
      color: white;
      font-size: 38px;
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 58px);
      letter-spacing: -.04em;
    }
    .lead {
      max-width: 520px;
      margin: 14px auto 34px;
      color: #716760;
      font-size: clamp(17px, 3vw, 20px);
      line-height: 1.55;
    }
    .card {
      padding: 22px;
      border-radius: 22px;
      background: #e8f5ef;
    }
    .card strong { display: block; margin-bottom: 7px; font-size: 19px; }
    .card p { margin: 0 0 14px; color: #65746d; line-height: 1.5; }
    a { color: #21786c; font-weight: 700; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
    footer { margin-top: 30px; color: #9a918b; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>Enotessa</h1>
    <p class="lead">Мы создаём мобильные приложения и игры — понятные, красивые и сделанные с вниманием к деталям.</p>

    <section class="card" aria-labelledby="documents-title">
      <strong id="documents-title">Документы приложений</strong>
      <p>Правила обработки данных и другая информация о наших проектах.</p>
      <a href="https://enotessa.github.io/muropolis-privacy/privacy/">Политика конфиденциальности «Мурополиса»</a>
    </section>

    <footer>Официальный сайт разработчика Enotessa</footer>
  </main>
</body>
</html>
