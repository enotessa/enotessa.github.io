<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enotessa — мобильные игры</title>
  <meta name="description" content="Официальный сайт разработчика мобильной игры «Мурополис».">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf8f2; color: #4b3a31; }
    main { width: min(560px, calc(100% - 40px)); padding: 40px; border: 1px solid #e6d8c5; border-radius: 28px; background: #fffaf0; box-shadow: 0 18px 50px rgba(73, 98, 82, .14); text-align: center; }
    .paw { font-size: 52px; }
    h1 { margin: 12px 0 8px; font-size: clamp(30px, 7vw, 46px); }
    p { font-size: 18px; line-height: 1.55; }
    a { color: #267e71; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <div class="paw" aria-hidden="true">🐾</div>
    <h1>Мурополис</h1>
    <p>Официальный сайт разработчика уютной мобильной игры о городе котиков.</p>
    <p><a href="https://enotessa.github.io/muropolis-privacy/privacy/">Политика конфиденциальности</a></p>
  </main>
</body>
</html>
